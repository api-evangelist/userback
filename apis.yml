aid: userback
name: Userback
description: >-
  Userback is a customer feedback platform that captures visual feedback,
  screenshots, screen recordings, and bug reports directly from in-product
  widgets installed on websites and web applications. The platform offers
  feedback boards, session replays, and integrations with project management
  and developer tools to streamline customer-driven product development.
  Userback's REST API uses Bearer token authentication for managing feedback,
  projects, users, and account data.
type: Index
